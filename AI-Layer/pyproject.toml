[project]
name = "ai-layer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "kd1726", email = "kevin.doku@mensahstudios.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "anthropic>=1.6.0",
    "asyncpg>=0.31.0",
    "colorlog>=6.12.0",
    "fastapi[standard]>=0.141.1",
    "langchain>=1.4.0",
    "langgraph>=1.2.11",
    "langsmith>=0.12.5",
    "openai>=3.14.0",
    "pydantic>=2.13.5",
    "sentry-sdk>=2.69.2",
    "tiktoken>=0.14.0",
]

[project.scripts]
ai-layer = "ai_layer:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
