[project]
name = "api-layer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "kd1726", email = "kevin.doku@mensahstudios.com" }
]
requires-python = ">=3.14"
dependencies = [
    "celery>=5.6.3",
    "colorlog>=6.12.0",
    "django>=6.1.1",
    "django-cors-headers>=4.9.0",
    "djangorestframework>=3.18.1",
    "presidio-anonymizer>=2.2.364",
    "pydantic>=2.13.5",
    "redis>=8.1.0",
    "requests>=2.34.2",
    "sentry-sdk>=2.69.2",
]

[project.scripts]
api-layer = "api_layer:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
